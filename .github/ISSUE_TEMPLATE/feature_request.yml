name: Feature request
description: Suggest an improvement to Politiker.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: need
    attributes:
      label: User need
      description: Describe the problem or need, rather than only the proposed implementation.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Explain how the feature should work for citizens using the service.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Describe existing workarounds or alternative solutions.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: This request does not contain personal data, credentials, or private correspondence.
          required: true
