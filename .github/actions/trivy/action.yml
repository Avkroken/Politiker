name: Trivy
description: >-
  Skannar en redan byggd, lokalt laddad image och laddar upp fynden till code
  scanning. Normalt fäller fynd inte bygget; den tillfälliga diagnostikgrinden
  längst ned håller just denna fix-PR öppen tills backloggen är tom.

# Composite action, inte en reusable workflow (`workflow_call`): en reusable
# workflow kör som ett EGET jobb på en EGEN runner, och imagen finns bara i den
# byggande runnerns docker-daemon (`load: true`). Att flytta den dit hade krävt
# `docker save` -> artifact -> `docker load`, alltså hela imagen fram och
# tillbaka som artifact vid varje körning. Playwright-basen är stor.

inputs:
  image-ref:
    description: Fullständig tagg på den lokalt laddade imagen som ska skannas.
    required: true
  category:
    description: >-
      Kategori i code scanning. Måste vara unik per image — annars skriver den
      ena imagens resultat över den andras.
    required: true

runs:
  using: composite
  steps:
    - name: Skanna imagen
      uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
      with:
        scan-type: image
        image-ref: ${{ inputs.image-ref }}
        format: sarif
        output: trivy-results.sarif
        ignore-unfixed: true
        severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
        limit-severities-for-sarif: true
        exit-code: '0'

    - name: Sammanfatta antal fynd
      shell: bash
      run: |
        set -euo pipefail
        count=$(jq '[.runs[]?.results[]?] | length' trivy-results.sarif)
        echo "Trivy-fynd: $count"
        echo "Trivy-fynd: **$count**" >> "$GITHUB_STEP_SUMMARY"

    # JSON innehåller även paketets sökväg/lager, vilket behövs för att skilja
    # appens uppgraderade pip-paket från äldre kopior som redan finns i basimagen.
    - name: Skapa detaljerad diagnostik
      shell: bash
      run: |
        set -euo pipefail
        trivy image --format json --ignore-unfixed \
          --severity UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL \
          --output trivy-results.json "${{ inputs.image-ref }}"

    - name: Spara Trivy-diagnostik
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: trivy-diagnostics-${{ inputs.category }}
        path: |
          trivy-results.sarif
          trivy-results.json
        retention-days: 1
        if-no-files-found: error

    - name: Kräv tom Trivy-backlog under fixen
      shell: bash
      run: |
        set -euo pipefail
        count=$(jq '[.runs[]?.results[]?] | length' trivy-results.sarif)
        if [ "$count" -ne 0 ]; then
          echo "::error::Trivy har $count fixbara fynd; se diagnostik-artifacten."
          exit 1
        fi

    - name: Ladda upp resultatet
      uses: github/codeql-action/upload-sarif@18420e3271f74589575af831a523c833acda327f # codeql-bundle-v2.26.2
      if: always()
      with:
        sarif_file: trivy-results.sarif
        category: ${{ inputs.category }}
