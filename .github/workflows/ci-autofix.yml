name: CI Autofix

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  notify-claude:
    runs-on: ubuntu-latest
    if: |
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.event == 'pull_request'
    steps:
      - name: Ask Claude to investigate and fix the failure
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            // Samma trovärdighetsprincip som auto-merge.yml: bara PR:er från
            // samma repo (inte forks) och skapade av den betrodda maintainern
            // eller kända bot-/AI-branchprefix får trigga autofixen.
            const trustedActor = 'blixten85';
            const trustedPrefixes = ['claude/', 'codex/', 'copilot/', 'fix/'];
            const run = context.payload.workflow_run;
            const prs = run.pull_requests || [];
            for (const pr of prs) {
              const { data: fullPr } = await github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: pr.number,
              });

              const sameRepo = fullPr.head.repo && fullPr.head.repo.full_name === `${context.repo.owner}/${context.repo.repo}`;
              const isTrustedAuthor = fullPr.user && fullPr.user.login === trustedActor;
              const isTrustedBranch = trustedPrefixes.some((prefix) => fullPr.head.ref.startsWith(prefix));

              if (!sameRepo || !(isTrustedAuthor || isTrustedBranch)) {
                console.log(`Skipping PR #${pr.number}: not from a trusted source (repo=${fullPr.head.repo && fullPr.head.repo.full_name}, author=${fullPr.user && fullPr.user.login}, branch=${fullPr.head.ref})`);
                continue;
              }

              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                body: `@claude The **${run.name}** workflow failed on this PR (run: ${run.html_url}). Please investigate the failure and push a fix.`,
              });
            }
