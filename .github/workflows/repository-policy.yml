name: Repository policy

on:
  pull_request:
    branches: [main]
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

jobs:
  dependency-review:
    name: Dependency review
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294
        with:
          base-ref: ${{ github.event_name == 'merge_group' && github.event.merge_group.base_sha || '' }}
          head-ref: ${{ github.event_name == 'merge_group' && github.event.merge_group.head_sha || '' }}
          retry-on-snapshot-warnings: true
          retry-on-snapshot-warnings-timeout: 300

  app:
    name: Node and Cloudflare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"
      - name: Validate app
        working-directory: app
        run: |
          npm ci
          npm test
          npm run typecheck
          npx wrangler deploy --dry-run

  python:
    name: Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
      - name: Validate kontakter
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r kontakter/requirements-dev.txt
          python -m pip install -r kontakter/scraper/requirements.txt
          python -m pip install -r kontakter/verify/requirements.txt
          cd kontakter
          pytest

  docker:
    name: Docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: docker compose -f kontakter/docker-compose.yml build --pull

  policy:
    name: Repository policy
    if: ${{ always() }}
    needs: [dependency-review, app, python, docker]
    runs-on: ubuntu-latest
    steps:
      - env:
          DEPENDENCY_REVIEW: ${{ needs.dependency-review.result }}
          APP: ${{ needs.app.result }}
          PYTHON: ${{ needs.python.result }}
          DOCKER: ${{ needs.docker.result }}
        shell: bash
        run: |
          set -euo pipefail
          for result in "$DEPENDENCY_REVIEW" "$APP" "$PYTHON" "$DOCKER"; do
            [[ "$result" == "success" ]] || { echo "::error::Required job failed: $result"; exit 1; }
          done
