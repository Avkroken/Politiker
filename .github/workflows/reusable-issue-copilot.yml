name: Reusable issue to Copilot

on:
  workflow_call:

permissions: {}

jobs:
  delegate:
    name: Delegate owner issue to Copilot
    if: ${{ github.event.issue.user.login == github.repository_owner }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - name: Assign Copilot cloud agent
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail

          payload="$(jq -cn             --arg repository "$REPOSITORY"             --arg base "$BASE_BRANCH"             '{
              assignees: ["copilot-swe-agent[bot]"],
              agent_assignment: {
                target_repo: $repository,
                base_branch: $base,
                custom_instructions: "Implementera issuet fokuserat. Följ repositoryts AGENTS.md, dokumenterade kontrakt och befintliga konventioner. Verifiera ändringen och uppdatera relevant dokumentation. Ändra inte säkerhets- eller behörighetsgränser utan uttryckligt stöd i issuet."
              }
            }'
          )"

          gh api --method POST             -H "Accept: application/vnd.github+json"             -H "X-GitHub-Api-Version: 2022-11-28"             "repos/${REPOSITORY}/issues/${ISSUE_NUMBER}/assignees"             --input - <<<"$payload" >/dev/null

          echo "Issue #${ISSUE_NUMBER} delegated to Copilot cloud agent."
