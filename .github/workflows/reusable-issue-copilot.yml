name: Reusable issue to Copilot

on:
  workflow_call:

permissions: {}

jobs:
  delegate:
    name: Delegate owner issue to Copilot
    if: ${{ vars.TRUSTED_AGENT_USER_LOGIN != '' && github.event.issue.user.login == vars.TRUSTED_AGENT_USER_LOGIN }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - name: Assign Copilot cloud agent
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
          COPILOT_AGENT_LOGIN: ${{ vars.TRUSTED_COPILOT_BOT_LOGIN }}
        run: |
          set -euo pipefail
          if [[ -z "$COPILOT_AGENT_LOGIN" ]]; then
            echo "::notice::TRUSTED_COPILOT_BOT_LOGIN is not configured; no cloud-agent assignment will be made."
            exit 0
          fi

          payload="$(jq -cn             --arg repository "$REPOSITORY"             --arg base "$BASE_BRANCH"             --arg agent "$COPILOT_AGENT_LOGIN"             '{
              assignees: [$agent],
              agent_assignment: {
                target_repo: $repository,
                base_branch: $base,
                custom_instructions: "Implementera issuet fokuserat. Följ repositoryts AGENTS.md, dokumenterade kontrakt och befintliga konventioner. Verifiera ändringen och uppdatera relevant dokumentation. Ändra inte säkerhets- eller behörighetsgränser utan uttryckligt stöd i issuet."
              }
            }'
          )"

          gh api --method POST             -H "Accept: application/vnd.github+json"             -H "X-GitHub-Api-Version: 2022-11-28"             "repos/${REPOSITORY}/issues/${ISSUE_NUMBER}/assignees"             --input - <<<"$payload" >/dev/null

          echo "Issue #${ISSUE_NUMBER} delegated to Copilot cloud agent."
