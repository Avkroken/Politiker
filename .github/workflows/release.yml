name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          last=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -1)
          current=${last#v}; current=${current:-0.0.0}
          range=${last:+$last..HEAD}; range=${range:-HEAD}
          messages=$(git log "$range" --format='%s%n%b')

          if grep -Eq '(^|[[:space:]])BREAKING CHANGE:|^[[:alnum:]_-]+(\([^)]*\))?!:' <<<"$messages"; then bump=major
          elif grep -Eq '^feat(\([^)]*\))?:' <<<"$messages"; then bump=minor
          elif grep -Eq '^(fix|perf)(\([^)]*\))?:' <<<"$messages"; then bump=patch
          else exit 0
          fi

          IFS=. read -r major minor patch <<<"$current"
          case $bump in
            major) major=$((major+1)); minor=0; patch=0 ;;
            minor) minor=$((minor+1)); patch=0 ;;
            patch) patch=$((patch+1)) ;;
          esac
          tag="v$major.$minor.$patch"
          gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" --target "$GITHUB_SHA" --generate-notes --title "$tag"
