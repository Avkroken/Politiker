name: Automatic GitHub Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Determine next semantic version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          LAST_TAG=$(git tag --list 'v*' --sort=-v:refname \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
            | sed -n '1p' || true)

          if [ -n "$LAST_TAG" ]; then
            RANGE="$LAST_TAG..HEAD"
            CURRENT="${LAST_TAG#v}"
          else
            RANGE="HEAD"
            CURRENT="0.0.0"
          fi

          MESSAGES=$(git log "$RANGE" --format='%s%n%b')
          BUMP="none"

          if printf '%s\n' "$MESSAGES" | grep -Eq '(^|[[:space:]])BREAKING CHANGE:|^[[:alnum:]_-]+(\([^)]*\))?!:|^major(\([^)]*\))?:'; then
            BUMP="major"
          elif printf '%s\n' "$MESSAGES" | grep -Eq '^feat(\([^)]*\))?:|^minor(\([^)]*\))?:'; then
            BUMP="minor"
          elif printf '%s\n' "$MESSAGES" | grep -Eq '^(fix|perf|patch)(\([^)]*\))?:'; then
            BUMP="patch"
          fi

          echo "bump=$BUMP" >> "$GITHUB_OUTPUT"
          if [ "$BUMP" = "none" ]; then
            echo "No release-worthy commit since ${LAST_TAG:-repository start}."
            exit 0
          fi

          IFS=. read -r MAJOR MINOR PATCH <<< "$CURRENT"
          case "$BUMP" in
            major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
            minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
            patch) PATCH=$((PATCH + 1)) ;;
          esac

          NEXT_TAG="v${MAJOR}.${MINOR}.${PATCH}"
          echo "tag=$NEXT_TAG" >> "$GITHUB_OUTPUT"
          echo "Next release: $NEXT_TAG ($BUMP)"

      - name: Create GitHub Release
        if: ${{ steps.version.outputs.bump != 'none' }}
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; nothing to do."
            exit 0
          fi

          gh release create "$RELEASE_TAG" \
            --target "$GITHUB_SHA" \
            --generate-notes \
            --title "$RELEASE_TAG"
