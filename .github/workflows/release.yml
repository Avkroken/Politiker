name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-main
  queue: max

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Determine next version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          last_tag=$(git tag --list 'v*' --sort=-v:refname \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
            | sed -n '1p' || true)

          if [[ -n "$last_tag" ]]; then
            range="$last_tag..HEAD"
            current="${last_tag#v}"
          else
            range="HEAD"
            current="0.0.0"
          fi

          messages=$(git log "$range" --format='%s%n%b')
          bump='none'

          if printf '%s\n' "$messages" | grep -Eq '(^|[[:space:]])BREAKING CHANGE:|^[[:alnum:]_-]+(\([^)]*\))?!:|^major(\([^)]*\))?:'; then
            bump='major'
          elif printf '%s\n' "$messages" | grep -Eq '^feat(\([^)]*\))?:|^minor(\([^)]*\))?:'; then
            bump='minor'
          elif printf '%s\n' "$messages" | grep -Eq '^(fix|perf|patch)(\([^)]*\))?:'; then
            bump='patch'
          fi

          echo "bump=$bump" >> "$GITHUB_OUTPUT"
          if [[ "$bump" == 'none' ]]; then
            exit 0
          fi

          IFS=. read -r major minor patch <<< "$current"
          case "$bump" in
            major) major=$((major + 1)); minor=0; patch=0 ;;
            minor) minor=$((minor + 1)); patch=0 ;;
            patch) patch=$((patch + 1)) ;;
          esac

          tag="v${major}.${minor}.${patch}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        if: ${{ steps.version.outputs.bump != 'none' }}
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists."
            exit 0
          fi
          gh release create "$RELEASE_TAG" \
            --target "$GITHUB_SHA" \
            --generate-notes \
            --title "$RELEASE_TAG"
