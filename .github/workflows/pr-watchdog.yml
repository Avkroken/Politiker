name: PR watchdog

# Säkerhetsnät för den slutna work-poolen. Om en work-gren innehåller commits
# ovanpå main men saknar öppen PR i mer än 60 minuter öppnar workflowen PR:n
# och armerar squash auto-merge. Ordinarie required checks, review-trådar och
# merge queue avgör fortfarande om PR:n faktiskt får mergas.

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: pr-watchdog
  cancel-in-progress: false

env:
  SLOTS: "work/feature work/fix work/chore"
  MAX_UNPR_MINUTES: "60"

jobs:
  open-missing-prs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Hämta automation App-token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.GAMNACKEN_ID }}
          private-key: ${{ secrets.GAMNACKEN_PEMKEY }}
          permission-contents: read
          permission-pull-requests: write

      - name: Öppna saknade PR:er och aktivera auto-merge
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const base = context.payload.repository?.default_branch || 'main';
            const slots = process.env.SLOTS.split(/\s+/).filter(Boolean);
            const maxAgeMs = Number(process.env.MAX_UNPR_MINUTES) * 60 * 1000;
            const now = Date.now();

            for (const slot of slots) {
              core.startGroup(slot);
              try {
                let branch;
                try {
                  branch = await github.rest.repos.getBranch({ owner, repo, branch: slot });
                } catch (error) {
                  if (error.status === 404) {
                    core.warning(`${slot} saknas; sync-pool får återskapa sloten. Fortsätter med nästa.`);
                    continue;
                  }
                  throw error;
                }
                const headSha = branch.data.commit.sha;

                const comparison = await github.rest.repos.compareCommitsWithBasehead({
                  owner,
                  repo,
                  basehead: `${base}...${slot}`,
                });

                if (comparison.data.ahead_by === 0) {
                  core.info(`${slot} har inga commits ovanpå ${base}.`);
                  continue;
                }

                const pulls = await github.paginate(github.rest.pulls.list, {
                  owner,
                  repo,
                  state: 'open',
                  head: `${owner}:${slot}`,
                  base,
                  per_page: 100,
                });

                let pr = pulls[0];
                if (pr) {
                  const marker = 'Den här PR:n öppnades automatiskt av `PR watchdog`.';
                  if (!(pr.body || '').includes(marker)) {
                    core.info(`${slot} har redan manuell PR #${pr.number}; lämnar auto-merge-policy till den.`);
                    continue;
                  }
                  core.info(`${slot} har watchdog-PR #${pr.number}; verifierar auto-merge igen.`);
                } else {
                  const tip = await github.rest.repos.getCommit({ owner, repo, ref: headSha });
                  const committedAt = tip.data.commit.committer?.date || tip.data.commit.author?.date;
                  if (!committedAt) {
                    core.warning(`Kan inte läsa commit-tid för ${slot}@${headSha}; lämnar grenen orörd.`);
                    continue;
                  }

                  const ageMs = now - Date.parse(committedAt);
                  const ageMinutes = Math.floor(ageMs / 60000);
                  if (ageMs <= maxAgeMs) {
                    core.info(`${slot}@${headSha.slice(0, 7)} är ${ageMinutes} min gammal; gränsen är >${process.env.MAX_UNPR_MINUTES} min.`);
                    continue;
                  }

                  const subject = (tip.data.commit.message || '').split('\n')[0].trim();
                  const title = subject || `auto: öppna PR för ${slot}`;
                  const body = [
                    'Den här PR:n öppnades automatiskt av `PR watchdog`.',
                    '',
                    `Branch \`${slot}\` hade commits ovanpå \`${base}\` utan öppen PR i ${ageMinutes} minuter.`,
                    `Watchdog-tip: \`${headSha.slice(0, 7)}\`.`,
                    '',
                    'Auto-merge armeras direkt. Required checks, relevanta review-trådar och merge queue måste fortfarande passera före squash merge.'
                  ].join('\n');

                  try {
                    const created = await github.rest.pulls.create({
                      owner,
                      repo,
                      head: slot,
                      base,
                      title,
                      body,
                      draft: false,
                      maintainer_can_modify: true,
                    });
                    pr = created.data;
                    core.notice(`Öppnade PR #${pr.number} för ${slot}.`);
                  } catch (error) {
                    // En parallell manuell/automatisk körning kan ha hunnit öppna PR:n.
                    if (error.status !== 422) throw error;
                    const existing = await github.rest.pulls.list({
                      owner,
                      repo,
                      state: 'open',
                      head: `${owner}:${slot}`,
                      base,
                      per_page: 1,
                    });
                    if (existing.data.length === 0) throw error;
                    pr = existing.data[0];
                    core.info(`PR #${pr.number} öppnades parallellt; använder den.`);
                  }
                }

                const node = await github.graphql(`
                  query($owner: String!, $repo: String!, $number: Int!) {
                    repository(owner: $owner, name: $repo) {
                      pullRequest(number: $number) { id autoMergeRequest { enabledAt } }
                    }
                  }
                `, { owner, repo, number: pr.number });

                if (node.repository.pullRequest.autoMergeRequest) {
                  core.info(`PR #${pr.number} har redan auto-merge aktiverat.`);
                  continue;
                }

                await github.graphql(`
                  mutation($pullRequestId: ID!) {
                    enablePullRequestAutoMerge(input: {
                      pullRequestId: $pullRequestId,
                      mergeMethod: SQUASH
                    }) {
                      pullRequest { number }
                    }
                  }
                `, { pullRequestId: node.repository.pullRequest.id });
                core.notice(`Auto-merge aktiverat på PR #${pr.number}.`);
              } finally {
                core.endGroup();
              }
            }
