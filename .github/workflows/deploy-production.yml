name: Deploy Politiker production

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: politiker-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Migrate, deploy and sync production
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_W1 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"

      - name: Validate deployment ref
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == "refs/heads/main" ]] || {
            echo "::error::Production deployment must be dispatched from main."
            exit 1
          }

      - name: Validate production credential
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${CLOUDFLARE_API_TOKEN:-}" ]] || {
            echo "::error::Required organization secret is not configured: CLOUDFLARE_API_TOKEN_W1"
            exit 1
          }

      - name: Install application dependencies
        working-directory: app
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Verify application
        working-directory: app
        run: npm run validate

      - name: Apply pending D1 migrations
        working-directory: app
        run: npm run migrate:production

      - name: Deploy Worker
        working-directory: app
        run: npm run deploy

      - name: Generate academic contact sync
        shell: bash
        run: |
          set -euo pipefail
          python kontakter/scraper/fetch_academics.py --sql-file "$RUNNER_TEMP/academic-contacts.sql"
          expected="$(python kontakter/scraper/fetch_academics.py --count)"
          [[ "$expected" =~ ^[0-9]+$ ]] || {
            echo "::error::Academic contact count is not numeric: $expected"
            exit 1
          }
          echo "EXPECTED_ACADEMIC_CONTACTS=$expected" >> "$GITHUB_ENV"

      - name: Sync academic contacts
        working-directory: app
        run: npx wrangler d1 execute politiker-eu --remote --file "$RUNNER_TEMP/academic-contacts.sql"

      - name: Verify academic contacts
        working-directory: app
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 execute politiker-eu --remote --json --command             "SELECT COUNT(*) AS contact_count, COUNT(DISTINCT academic_field) AS field_count FROM public_contacts WHERE area_type='academia' AND academic_field IN ('political-science','public-administration','public-law');"             > "$RUNNER_TEMP/academic-check.json"
          python - "$RUNNER_TEMP/academic-check.json" "$EXPECTED_ACADEMIC_CONTACTS" <<'PY'
          import json
          import sys

          path = sys.argv[1]
          expected = int(sys.argv[2])
          with open(path, encoding="utf-8") as handle:
              payload = json.load(handle)

          def find_counts(value):
              if isinstance(value, dict):
                  if "contact_count" in value and "field_count" in value:
                      return int(value["contact_count"]), int(value["field_count"])
                  for child in value.values():
                      found = find_counts(child)
                      if found:
                          return found
              elif isinstance(value, list):
                  for child in value:
                      found = find_counts(child)
                      if found:
                          return found
              return None

          counts = find_counts(payload)
          if counts is None:
              raise SystemExit("Kunde inte läsa akademisk efterkontroll från Wrangler JSON.")

          contacts, fields = counts
          print(f"Akademi efter deploy: {contacts} kontakter över {fields} kärnområden.")
          if contacts < expected:
              raise SystemExit(f"För få akademikontakter: {contacts}, förväntade minst {expected}.")
          if fields != 3:
              raise SystemExit(f"Fel antal akademiska kärnområden: {fields}, förväntade 3.")
          PY

      - name: Verify public ingress
        working-directory: app
        run: npm run verify:production
