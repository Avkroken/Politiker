name: CI

on:
  pull_request:
    branches: [main]
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  required:
    name: CI / required
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Validate Workers
        run: |
          cd app
          npm ci
          npm run validate
          npx wrangler deploy --dry-run --config ../log-archive/wrangler.jsonc --outdir ../log-archive/.wrangler/dry-run
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.x"
          cache: pip
          cache-dependency-path: "kontakter/**/requirements.txt"
      - name: Validate contacts tooling
        working-directory: kontakter
        run: |
          find . -name requirements.txt -print0 | xargs -0 -r -n1 python -m pip install -r
          python -m compileall -q .
          if [ -d tests ]; then
            python -m pip install pytest
            python -m pytest
          fi
