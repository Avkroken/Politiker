name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  impact:
    name: CI / impact
    runs-on: ubuntu-latest
    outputs:
      python: ${{ steps.impact.outputs.python }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Bestäm språk-/komponentpåverkan
        id: impact
        env:
          CI_BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          CI_HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: bash .github/scripts/ci-impact.sh

  typecheck:
    name: CI / typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Installera beroenden
        run: npm ci

      - name: Validera JavaScript, Worker-typer, TypeScript och Wrangler-deployment
        run: npm run validate

  python:
    name: CI / python
    needs: impact
    if: ${{ always() && (needs.impact.result != 'success' || needs.impact.outputs.python == 'true') }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kontakter
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.x'
          cache: pip

      - name: Installera beroenden
        run: |
          python -m pip install --upgrade pip
          find . -name 'requirements.txt' -print0 | xargs -0 -r -n1 python -m pip install -r

      - name: Kompilera
        run: python -m compileall .

      - name: Kör tester
        run: |
          if [ -d tests ]; then
            python -m pip install pytest
            python -m pytest
          else
            echo "Ingen tests-katalog, hoppar över."
          fi

  required:
    name: CI / required
    if: ${{ always() }}
    needs: [typecheck, python]
    runs-on: ubuntu-latest
    steps:
      - name: Kontrollera required CI
        env:
          TYPECHECK_RESULT: ${{ needs.typecheck.result }}
          PYTHON_RESULT: ${{ needs.python.result }}
        run: |
          test "$TYPECHECK_RESULT" = "success"
          test "$PYTHON_RESULT" = "success" -o "$PYTHON_RESULT" = "skipped"
