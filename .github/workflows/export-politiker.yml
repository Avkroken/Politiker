name: Exportera politiker-data från D1

on:
  schedule:
    - cron: '30 4 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: export-politiker
  cancel-in-progress: false

jobs:
  export:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kontakter
    steps:
      - name: Prägla apptoken
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.GAMNACKEN_ID }}
          private-key: ${{ secrets.GAMNACKEN_PEMKEY }}
          permission-contents: write
          permission-pull-requests: write

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          token: ${{ steps.app-token.outputs.token }}

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.x'

      - name: Installera beroenden
        run: python3 -m pip install requests

      - name: Exportera från D1
        env:
          CLOUDFLARE_API_TOKEN_POLITIKER: ${{ secrets.POLITIKER_D1_READ }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_KONTO_ID }}
          D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID }}
        run: |
          python3 export/export_d1.py
          cp data/recipient-meta.json ../app/public/recipient-meta.json

      - name: Öppna PR vid ändring
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        working-directory: .
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain kontakter/data/ app/public/recipient-meta.json)" ]; then
            echo "Ingen ändring i export eller metadata."
            exit 0
          fi

          if gh pr list --base main --state open --json headRefName \
            --jq '.[] | select(.headRefName | startswith("automation/politiker-export-")) | .headRefName' \
            | grep -q .; then
            echo "En export-PR är redan öppen; skapar ingen dubblett."
            exit 0
          fi

          branch="automation/politiker-export-${GITHUB_RUN_ID}"
          git switch -c "$branch"
          git config user.name "${{ steps.app-token.outputs.app-slug }}[bot]"
          git config user.email "${{ steps.app-token.outputs.installation-id }}+${{ steps.app-token.outputs.app-slug }}[bot]@users.noreply.github.com"
          git add kontakter/data/ app/public/recipient-meta.json
          git commit -m "data: uppdatera politiker-export och mottagarmetadata"
          git push origin "$branch"

          gh pr create --base main --head "$branch" \
            --title "data: uppdatera politiker-export från D1" \
            --body 'Automatisk export av aktiva kontakter samt statisk mottagarmetadata från live-D1. Merge sker manuellt med repositoryts vanliga squash-regler.'
