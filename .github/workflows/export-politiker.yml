name: Exportera politiker-data från D1

# Läser politicians-tabellen i tjänstens D1 (read-only) och committar en
# uppdaterad kontakter/data/-export samt statisk recipient-meta.json via PR.
# Ingen extern skrapning sker här — datan kommer från den publika D1:n.

on:
  schedule:
    - cron: '30 4 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: export-politiker
  cancel-in-progress: false

jobs:
  export:
    runs-on: ubuntu-latest
    environment: produktion
    defaults:
      run:
        working-directory: kontakter
    steps:
      - name: Prägla apptoken
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.POLITIKER_OCH_IDEMPOTENT }}
          private-key: ${{ secrets.POLITIKER_OCH_IDEMPOTENT }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: dev
          token: ${{ steps.app-token.outputs.token }}

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.x'

      - name: Installera beroenden
        run: python3 -m pip install requests

      - name: Exportera från D1
        env:
          CLOUDFLARE_API_TOKEN_POLITIKER: ${{ secrets.POLITIKER_D1_READ }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID }}
        run: |
          python3 export/export_d1.py
          cp data/recipient-meta.json ../app/public/recipient-meta.json

      - name: Öppna PR vid ändring
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        working-directory: .
        run: |
          if [ -z "$(git status --porcelain kontakter/data/ app/public/recipient-meta.json)" ]; then
            echo "Ingen ändring i export eller metadata — hoppar över."
            exit 0
          fi
          git config user.name "${{ steps.app-token.outputs.app-slug }}[bot]"
          git config user.email "${{ steps.app-token.outputs.installation-id }}+${{ steps.app-token.outputs.app-slug }}[bot]@users.noreply.github.com"
          git add kontakter/data/ app/public/recipient-meta.json
          git commit -m "data: uppdatera politiker-export och mottagarmetadata"
          git pull --rebase origin dev
          git push origin dev
          PR_URL=$(gh pr list --base main --head dev --state open --json url --jq '.[0].url // empty')
          if [ -z "$PR_URL" ]; then
            PR_URL=$(gh pr create --base main --head dev \
              --title "data: uppdatera politiker-export från D1" \
              --body 'Automatisk export av aktiva kontakter samt statisk mottagarmetadata från live-D1.')
          fi
          gh pr merge --auto --squash "$PR_URL"
