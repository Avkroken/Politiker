name: Codex issue remediation bridge

on:
  issue_comment:
    types: [created]

permissions:
  contents: read

concurrency:
  group: codex-issue-remediation
  cancel-in-progress: false

jobs:
  bridge:
    runs-on: ubuntu-latest
    steps:
      - name: Validera betrodd remediation-trigger
        id: gate
        shell: bash
        run: |
          set -euo pipefail
          issue_number="$(jq -r '.issue.number // empty' "$GITHUB_EVENT_PATH")"
          is_pr="$(jq -r 'has("issue") and (.issue | has("pull_request"))' "$GITHUB_EVENT_PATH")"
          user="$(jq -r '.comment.user.login // empty' "$GITHUB_EVENT_PATH")"
          body="$(jq -r '.comment.body // ""' "$GITHUB_EVENT_PATH")"

          eligible=false
          retry=false
          if [ -n "$issue_number" ] && [ "$is_pr" != "true" ]; then
            if [ "$user" = "gamnacken[bot]" ] && grep -Fq '<!-- skvallerbyttan-remediation:active -->' <<<"$body"; then
              eligible=true
            elif [ "$user" = "blixten85" ] && grep -Fq '<!-- skvallerbyttan-remediation:retry -->' <<<"$body"; then
              eligible=true
              retry=true
            fi
          fi

          echo "eligible=$eligible" >> "$GITHUB_OUTPUT"
          echo "issue_number=$issue_number" >> "$GITHUB_OUTPUT"
          echo "retry=$retry" >> "$GITHUB_OUTPUT"

      - name: Hämta Gamnacken App-token
        if: steps.gate.outputs.eligible == 'true'
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.GAMNACKEN_ID }}
          private-key: ${{ secrets.GAMNACKEN_PEMKEY }}
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.gate.outputs.eligible == 'true'
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
          token: ${{ steps.app-token.outputs.token }}

      - name: Kontrollera om issue redan har en aktiv Codex-PR
        if: steps.gate.outputs.eligible == 'true'
        id: existing
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          ISSUE_NUMBER: ${{ steps.gate.outputs.issue_number }}
        run: |
          set -euo pipefail
          marker="<!-- skvallerbyttan-remediation-issue:${ISSUE_NUMBER} -->"
          pr_url="$(
            gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls?state=open&per_page=100" |
              jq -sr --arg marker "$marker" --arg repo "$GITHUB_REPOSITORY" \
                '[.[][] | select(.head.repo.full_name == $repo and ((.body // "") | contains($marker)))][0].html_url // empty'
          )"

          if [ -n "$pr_url" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "url=$pr_url" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Välj körningsunik arbetsgren
        if: steps.gate.outputs.eligible == 'true' && steps.existing.outputs.exists != 'true'
        id: branch
        shell: bash
        env:
          ISSUE_NUMBER: ${{ steps.gate.outputs.issue_number }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: echo "name=automation/codex-issue/${ISSUE_NUMBER}-${RUN_ID}-${RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"

      - name: Skapa seed-commit
        if: steps.gate.outputs.eligible == 'true' && steps.existing.outputs.exists != 'true'
        shell: bash
        env:
          BRANCH: ${{ steps.branch.outputs.name }}
          ISSUE_NUMBER: ${{ steps.gate.outputs.issue_number }}
        run: |
          set -euo pipefail
          git checkout -B "$BRANCH" origin/main
          git config user.name "gamnacken[bot]"
          git config user.email "316993076+gamnacken[bot]@users.noreply.github.com"

          seed_dir=".github/codex-dispatch"
          seed_file="${seed_dir}/issue-${ISSUE_NUMBER}.md"
          mkdir -p "$seed_dir"
          cat > "$seed_file" <<EOF
          # Codex remediation seed

          This temporary file exists only to create a pull request context for security issue #${ISSUE_NUMBER}.

          Codex must read the issue, implement and verify the smallest safe fix, and delete this file before the pull request is complete.
          EOF

          git add "$seed_file"
          git commit -m "chore: seed Codex remediation for #${ISSUE_NUMBER}"
          git push origin "HEAD:$BRANCH"

      - name: Skapa PR och armera auto-merge
        if: steps.gate.outputs.eligible == 'true' && steps.existing.outputs.exists != 'true'
        id: pr
        shell: bash
        env:
          BRANCH: ${{ steps.branch.outputs.name }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          ISSUE_NUMBER: ${{ steps.gate.outputs.issue_number }}
        run: |
          set -euo pipefail
          body_file="$(mktemp)"
          cat > "$body_file" <<EOF
          <!-- skvallerbyttan-remediation -->
          <!-- skvallerbyttan-remediation-issue:${ISSUE_NUMBER} -->

          Automatisk Codex-remediation för säkerhetsissue #${ISSUE_NUMBER}.

          Seed-filen under \`.github/codex-dispatch/\` är tillfällig och required \`typecheck\` blockerar merge tills Codex har tagit bort den.

          Fixes #${ISSUE_NUMBER}
          EOF

          pr_url="$(gh pr create --base main --head "$BRANCH" --title "fix(security): remediate issue #${ISSUE_NUMBER}" --body-file "$body_file")"
          echo "url=$pr_url" >> "$GITHUB_OUTPUT"
          gh pr merge --auto --squash "$pr_url"

      - name: Spara issue-association och verifiera auto-merge
        if: steps.gate.outputs.eligible == 'true'
        id: reconcile
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          ISSUE_NUMBER: ${{ steps.gate.outputs.issue_number }}
          EXISTING_PR_URL: ${{ steps.existing.outputs.url }}
          CREATED_PR_URL: ${{ steps.pr.outputs.url }}
        run: |
          set -euo pipefail
          pr_url="${EXISTING_PR_URL:-${CREATED_PR_URL:-}}"
          if [ -z "$pr_url" ]; then
            echo "Ingen remediation-PR att arbeta med." >&2
            exit 1
          fi
          echo "url=$pr_url" >> "$GITHUB_OUTPUT"

          auto_merge_enabled="$(gh pr view "$pr_url" --json autoMergeRequest --jq '.autoMergeRequest.enabledAt // empty')"
          if [ -z "$auto_merge_enabled" ]; then
            gh pr merge --auto --squash "$pr_url"
          fi

          association_marker="<!-- skvallerbyttan-codex-pr:${ISSUE_NUMBER} -->"
          association_found="$(
            gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments?per_page=100" |
              jq -r --arg marker "$association_marker" --arg url "$pr_url" \
                '.[] | select(.user.login == "gamnacken[bot]" and ((.body // "") | contains($marker)) and ((.body // "") | contains($url))) | .id' |
              sed -n '1p'
          )"
          if [ -z "$association_found" ]; then
            issue_body="$(mktemp)"
            cat > "$issue_body" <<EOF
          ${association_marker}
          Codex-remediation har flyttats till PR-kontext: ${pr_url}. Auto-merge är armerad; required CI och review-trådar är fortsatt blockerande.
          EOF
            gh issue comment "$ISSUE_NUMBER" --body-file "$issue_body"
          fi

      - name: Delegera arbetet till Codex på PR:n
        if: steps.gate.outputs.eligible == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          ISSUE_NUMBER: ${{ steps.gate.outputs.issue_number }}
          PR_URL: ${{ steps.reconcile.outputs.url }}
          EXPLICIT_RETRY: ${{ steps.gate.outputs.retry }}
        run: |
          set -euo pipefail
          pr_number="$(gh pr view "$PR_URL" --json number --jq '.number')"
          delegation_marker="<!-- skvallerbyttan-codex-delegated:${ISSUE_NUMBER} -->"
          delegation_found="$(
            gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/${pr_number}/comments?per_page=100" |
              jq -r --arg marker "$delegation_marker" \
                '.[] | select(.user.login == "gamnacken[bot]" and ((.body // "") | contains($marker))) | .id' |
              sed -n '1p'
          )"
          if [ "$EXPLICIT_RETRY" != "true" ] && [ -n "$delegation_found" ]; then
            echo "Codex-delegering finns redan på PR #${pr_number}."
            exit 0
          fi

          prompt_file="$(mktemp)"
          cat > "$prompt_file" <<EOF
          ${delegation_marker}
          @codex implement security issue #${ISSUE_NUMBER} autonomously on this PR.

          Requirements:
          - Read issue #${ISSUE_NUMBER} and verify the underlying security finding.
          - Read and follow AGENTS.md and SKILLS.md before changing code.
          - Make the smallest safe fix without changing or dismissing the security alert state.
          - Keep all work on this existing PR/branch; do not create another branch or PR.
          - Delete \`.github/codex-dispatch/issue-${ISSUE_NUMBER}.md\` before completion; required \`typecheck\` intentionally blocks merge while it exists.
          - Run relevant checks and fix every valid CI or review finding on this same PR.
          - Re-read review summaries and unresolved inline threads after every push.
          - Resolve a review thread only after its valid finding is fixed or a concrete evidentiary reply shows why no change is correct.
          - Auto-merge is already armed; do not bypass required checks, review resolution, or repository rules.
          EOF
          gh pr comment "$PR_URL" --body-file "$prompt_file"
