name: Dependabot auto-merge

on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    steps:
      - name: Ingen åtgärd för vanliga PR:er
        if: github.event.pull_request.user.login != 'dependabot[bot]'
        run: echo "Inte en Dependabot-PR; checken avslutas grönt utan merge."

      - name: Aktivera auto-merge för Dependabot
        if: github.event.pull_request.user.login == 'dependabot[bot]'
        run: gh pr merge --auto --merge "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
