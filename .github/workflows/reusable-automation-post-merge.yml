name: Reusable automation post-merge dispatch

on:
  workflow_call:

permissions: {}

jobs:
  dispatch:
    name: Dispatch trusted automation merge
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      actions: read
      contents: write
      pull-requests: read
    steps:
      - name: Dispatch merged trusted automation PRs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_STARTED_AT: ${{ github.event.workflow_run.run_started_at }}
          TRUSTED_AGENT_USER_LOGIN: ${{ vars.TRUSTED_AGENT_USER_LOGIN }}
          TRUSTED_AGENT_BOT_LOGIN: ${{ vars.TRUSTED_AGENT_BOT_LOGIN }}
          TRUSTED_DEPENDABOT_LOGIN: ${{ vars.TRUSTED_DEPENDABOT_LOGIN }}
          TRUSTED_COPILOT_BOT_LOGIN: ${{ vars.TRUSTED_COPILOT_BOT_LOGIN }}
        run: |
          set -euo pipefail

          owner="${REPOSITORY%%/*}"
          repo_name="${REPOSITORY#*/}"
          default_branch="$(gh api "repos/${REPOSITORY}" --jq '.default_branch')"

          trusted_merges() {
            gh api "repos/${REPOSITORY}/pulls?state=closed&sort=updated&direction=desc&per_page=100" |
              jq -c                 --arg repository "${REPOSITORY}"                 --arg default_branch "${default_branch}"                 --arg started "${RUN_STARTED_AT}"                 --arg trusted_user "${TRUSTED_AGENT_USER_LOGIN}"                 --arg trusted_bot "${TRUSTED_AGENT_BOT_LOGIN}"                 --arg dependabot "${TRUSTED_DEPENDABOT_LOGIN}"                 --arg copilot "${TRUSTED_COPILOT_BOT_LOGIN}" '
                  .[]
                  | select(.merged_at != null and .merged_at >= $started)
                  | select(.head.repo.full_name == $repository)
                  | select(.base.ref == $default_branch)
                  | select(
                      (
                        (.head.ref | startswith("codex/"))
                        and (
                          ($trusted_user != "" and .user.login == $trusted_user and .user.type == "User")
                          or
                          ($trusted_bot != "" and .user.login == $trusted_bot and .user.type == "Bot")
                        )
                      )
                      or ($dependabot != "" and .user.login == $dependabot and .user.type == "Bot")
                      or ($copilot != "" and .user.login == $copilot and .user.type == "Bot")
                    )
                  | {
                      pr_number: .number,
                      merge_sha: .merge_commit_sha,
                      head_sha: .head.sha,
                      merged_at: .merged_at
                    }
                '
          }

          for _ in $(seq 1 10); do
            mapfile -t merges < <(trusted_merges)
            if ((${#merges[@]} > 0)); then
              for merge in "${merges[@]}"; do
                number="$(jq -r '.pr_number' <<<"${merge}")"
                merge_sha="$(jq -r '.merge_sha' <<<"${merge}")"
                head_sha="$(jq -r '.head_sha' <<<"${merge}")"
                merged_at="$(jq -r '.merged_at' <<<"${merge}")"

                existing_dispatches="$(
                  gh api "repos/${REPOSITORY}/actions/runs?event=repository_dispatch&head_sha=${merge_sha}&per_page=100"                     --jq '.total_count'
                )"
                if ((existing_dispatches > 0)); then
                  echo "Dispatch already exists for merge ${merge_sha}; skipping PR #${number}."
                  continue
                fi

                jq -nc                   --arg event_type "agent-pr-merged"                   --argjson pr_number "${number}"                   --arg merge_sha "${merge_sha}"                   --arg head_sha "${head_sha}"                   --arg merged_at "${merged_at}"                   '{
                    event_type: $event_type,
                    client_payload: {
                      pr_number: $pr_number,
                      merge_sha: $merge_sha,
                      head_sha: $head_sha,
                      merged_at: $merged_at
                    }
                  }' |
                  gh api --method POST "repos/${owner}/${repo_name}/dispatches" --input -

                echo "Dispatched agent-pr-merged for PR #${number} (${merge_sha})."
              done
              exit 0
            fi
            sleep 3
          done

          echo "No trusted automation PR merged during the source workflow run."
