name: Deploy

# Auto-deploy till Cloudflare. Repot har EN Worker (politiker) som bär allt:
# HTTP-appen, kö-konsumenten och cron-körningarna.
#
# Secrets (Repo → Settings → Environments → produktion):
#   POLITIKER — delad Cloudflare API-token med Workers Scripts, D1, KV,
#               Queues, R2 och Workers Routes Write.
#
# Variables (Repo → Settings → Variables → Actions):
#   CLOUDFLARE_ACCOUNT_ID — kontots ID.
#
# Namnmigreringen är idempotent och körs före varje deploy. Efter första
# lyckade körningen blir den en verifiering/no-op. Den gamla R2-bucketen
# behålls som återställningspunkt.

on:
  push:
    branches: [main]
  repository_dispatch:
    types: [deploy-main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  migrate-names:
    environment: produktion
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 24.18.0
      - name: Migrate Cloudflare resource names
        run: node scripts/migrate-cloudflare-names.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.POLITIKER }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

  deploy:
    needs: migrate-names
    environment: produktion
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 24.18.0
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install
        run: npm ci
      - name: Deploy
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.POLITIKER }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
