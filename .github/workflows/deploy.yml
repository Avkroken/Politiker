name: Deploy

# Auto-deploy till Cloudflare. Repot har EN Worker (politiker) som bär allt:
# HTTP-appen, kö-konsumenten och cron-körningarna.
#
# Secrets (Repo → Settings → Environments → produktion):
#   POLITIKER — delad Cloudflare API-token med Workers Scripts, D1, KV,
#               Queues, R2 och Workers Routes Write.
#
# Variables (Repo → Settings → Variables → Actions):
#   CLOUDFLARE_ACCOUNT_ID — kontots ID.

on:
  push:
    branches: [main]
  repository_dispatch:
    types: [deploy-main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    environment: produktion
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install
        run: npm ci
      - name: Applicera databasmigreringar
        working-directory: .
        run: bash infra/apply-migrations.sh
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.POLITIKER }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy
        run: npx wrangler deploy --config ../wrangler.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.POLITIKER }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
