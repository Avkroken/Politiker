name: Synka nyhetsredaktioner till D1

# Manuell, isolerad mediasynk. Kör endast fetch_media.py och rör inte
# kommuner, regioner, riksdag, regering, EU eller kyrkodata.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-media
  cancel-in-progress: false

jobs:
  sync-media:
    runs-on: ubuntu-latest
    environment: produktion
    defaults:
      run:
        working-directory: kontakter/scraper
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.x'

      - name: Installera beroenden
        run: python3 -m pip install requests

      - name: Synka endast nyhetsredaktioner
        env:
          CLOUDFLARE_API_TOKEN_POLITIKER: ${{ secrets.POLITIKER }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID }}
        run: python3 fetch_media.py
