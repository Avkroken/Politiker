name: Automation post-merge dispatch

on:
  workflow_run:
    workflows: ["Agent auto-merge", "Bot PR lifecycle", "Dependabot auto-merge"]
    types: [completed]

permissions: {}

concurrency:
  group: automation-post-merge-${{ github.repository }}
  cancel-in-progress: false

jobs:
  dispatch:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    permissions:
      actions: read
      contents: write
      pull-requests: read
    uses: ./.github/workflows/reusable-automation-post-merge.yml
