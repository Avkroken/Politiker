name: Docker Image CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the Docker image
        run: docker build kontakter/scraper --file kontakter/scraper/Dockerfile --tag my-image-name:$(date +%s)

  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r kontakter/scraper/requirements.txt
          pip install -r kontakter/verify/requirements.txt
          pip install pytest
      - name: Run tests
        run: pytest kontakter/tests
