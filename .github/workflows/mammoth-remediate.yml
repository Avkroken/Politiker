name: Mammoth remediation

on: push

jobs:
  remediate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 24
      - name: Update Mammoth and lockfile
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cd app
          npm install mammoth@1.12.2 --save --package-lock-only
          cd ..
          rm -f .github/codex-dispatch/issue-327.md
          git add app/package.json app/package-lock.json .github/codex-dispatch/issue-327.md
          git commit -m "fix(security): update mammoth to 1.12.2"
          git push origin HEAD:work/fix
