version: 2
updates:
  - package-ecosystem: npm
    directories:
      - /app
      - /log-archive
    schedule:
      interval: weekly
    groups:
      npm-minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: pip
    directories:
      - /kontakter
      - /kontakter/scraper
      - /kontakter/verify
    schedule:
      interval: weekly
    groups:
      python-minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: docker
    directory: /kontakter/scraper
    schedule:
      interval: weekly

  - package-ecosystem: docker-compose
    directory: /kontakter
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions-minor-and-patch:
        update-types:
          - minor
          - patch
