version: 2
updates:
  - package-ecosystem: "npm"
    assignees: ["blixten85"]
    directories:
      - "/app"
      - "/sender"
      - "/campaign"
      # /healthcheck är en egen Cloudflare Worker (package.json +
      # wrangler.jsonc) som saknades här och därför aldrig bevakats.
      - "/healthcheck"
    schedule:
      interval: "weekly"
      day: "wednesday"
      time: "03:00"
      timezone: "Europe/Stockholm"
    groups:
      npm-patch-minor:
        update-types: ["minor", "patch"]

  - package-ecosystem: "github-actions"
    assignees: ["blixten85"]
    directory: "/"
    schedule:
      interval: "weekly"
      day: "wednesday"
      time: "04:00"
      timezone: "Europe/Stockholm"
    groups:
      actions-patch-minor:
        update-types: ["minor", "patch"]
