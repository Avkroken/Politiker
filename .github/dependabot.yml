version: 2
updates:
  - package-ecosystem: "pip"
    directories:
      - "/scraper"
      - "/verify"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "03:00"
      timezone: "Europe/Stockholm"
    groups:
      pip-patch-minor:
        update-types: ["minor", "patch"]

  - package-ecosystem: "docker"
    directory: "/scraper"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "03:30"
      timezone: "Europe/Stockholm"
    groups:
      docker-patch-minor:
        update-types: ["minor", "patch"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "04:00"
      timezone: "Europe/Stockholm"
    groups:
      actions-patch-minor:
        update-types: ["minor", "patch"]
