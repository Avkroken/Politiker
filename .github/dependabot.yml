version: 2
updates:
  - package-ecosystem: "npm"
    assignees: ["blixten85"]
    directories:
      # En Worker kvar sedan app, sender, campaign och healthcheck slogs ihop.
      - "/app"
    schedule:
      interval: "weekly"
      day: "wednesday"
      time: "03:00"
      timezone: "Europe/Stockholm"
    groups:
      npm-patch-minor:
        update-types: ["minor", "patch"]

  - package-ecosystem: "github-actions"
    assignees: ["blixten85"]
    directory: "/"
    schedule:
      interval: "weekly"
      day: "wednesday"
      time: "04:00"
      timezone: "Europe/Stockholm"
    groups:
      actions-patch-minor:
        update-types: ["minor", "patch"]

  # Scrapern och verifieringsskripten som flyttade hit från
  # politiker-kontakter. Egna requirements.txt per katalog.
  # kontakter/scraper/Dockerfile. Basimagen är den enda källan till nästan
  # alla Trivy-fynd, så utan den här posten rapporteras fynd som ingen
  # åtgärdar. Dependabot bumpar inom samma taggfamilj (-noble), inte över
  # Ubuntu-generationer — det byter man för hand.
  - package-ecosystem: "docker"
    assignees: ["blixten85"]
    directory: "/kontakter/scraper"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "00:20"
      timezone: "Europe/Stockholm"

  - package-ecosystem: "pip"
    assignees: ["blixten85"]
    directories:
      - "/kontakter/scraper"
      - "/kontakter/verify"
    schedule:
      interval: "weekly"
      day: "wednesday"
      time: "03:00"
      timezone: "Europe/Stockholm"
    groups:
      pip-patch-minor:
        update-types: ["minor", "patch"]
