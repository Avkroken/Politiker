version: 2
updates:
  - package-ecosystem: "pip"
    assignees: ["blixten85"]
    directories:
      - "/scraper"
      - "/verify"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "03:00"
      timezone: "Europe/Stockholm"
    groups:
      pip-patch-minor:
        update-types: ["minor", "patch"]

  - package-ecosystem: "docker"
    assignees: ["blixten85"]
    directory: "/scraper"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "03:30"
      timezone: "Europe/Stockholm"
    groups:
      docker-patch-minor:
        update-types: ["minor", "patch"]

  # docker-compose.yml i roten låg utanför bevakningen. Compose är ett EGET
  # ekosystem i Dependabot, skilt från "docker" (som bara läser Dockerfile).
  - package-ecosystem: "docker-compose"
    assignees: ["blixten85"]
    directory: "/"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "03:40"
      timezone: "Europe/Stockholm"
    groups:
      docker-compose-patch-minor:
        update-types: ["minor", "patch"]

  - package-ecosystem: "github-actions"
    assignees: ["blixten85"]
    directory: "/"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "04:00"
      timezone: "Europe/Stockholm"
    groups:
      actions-patch-minor:
        update-types: ["minor", "patch"]
