<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#161826">
  <title>Politikerkontakt</title>
  <link rel="stylesheet" href="/nocturne.css">
  <link rel="stylesheet" href="/politiker.css">
  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
</head>
<body>
  <header id="app-header" hidden>
    <nav class="nav app-nav" aria-label="Huvudnavigering">
      <a class="nav-brand" href="#home">Politikerkontakt</a>
      <div id="primary-nav" class="app-nav-links"></div>
      <button id="menu-button" class="btn btn-secondary btn-icon" type="button" aria-label="Öppna meny">☰</button>
    </nav>
  </header>
  <div id="global-notices" class="app-notices" aria-live="polite"></div>
  <main id="root"></main>
  <div id="mobile-menu" class="dialog-backdrop app-mobile-menu" hidden>
    <nav class="dialog app-mobile-dialog" aria-label="Mobilmeny">
      <div class="dialog-title">Meny</div>
      <div id="mobile-nav" class="app-menu-list"></div>
      <div class="dialog-actions"><button id="mobile-close" class="btn btn-secondary" type="button">Stäng</button></div>
    </nav>
  </div>
  <div id="modal" class="dialog-backdrop" hidden>
    <section class="dialog" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <div id="modal-title" class="dialog-title"></div>
      <div id="modal-body" class="dialog-body"></div>
      <div class="dialog-actions"><button id="modal-close" class="btn btn-secondary" type="button">Stäng</button></div>
    </section>
  </div>
  <script type="module" src="/app.js"></script>
</body>
</html>
