<!doctype html>
<html lang="sv" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0f1115">
  <title>Politikerkontakt</title>
  <link rel="stylesheet" href="/v2.css">
  <link rel="stylesheet" href="/v2-polish.css">
  <link rel="stylesheet" href="/mobile-fixes.css">
  <link rel="stylesheet" href="/ux-safety.css">
  <script src="/route-bootstrap.js"></script>
  <script src="/ui-inputs.js" defer></script>
  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
  <script src="https://cdn.jsdelivr.net/npm/mammoth@1.10.0/mammoth.browser.min.js" defer></script>
  <script src="/composer-enhancements.js" defer></script>
  <script src="/ux-safety.js" defer></script>
  <script src="/feedback-ui.js" defer></script>
  <script src="/admin-feedback.js" defer></script>
</head>
<body>
  <header class="app-header" id="app-header" hidden>
    <div class="header-inner">
      <div class="brand" role="banner"><span class="brand-mark" aria-hidden="true">🇸🇪</span><span>Politikerkontakt</span></div>
      <nav class="desktop-nav" id="desktop-nav" aria-label="Huvudnavigering"></nav>
      <button class="menu-button" id="menu-button" type="button" aria-label="Öppna meny">☰</button>
    </div>
  </header>
  <div class="global-notices" id="global-notices" aria-live="polite"></div>
  <main id="root"></main>
  <aside class="drawer" id="drawer" aria-label="Meny">
    <div class="drawer-backdrop" id="drawer-backdrop"></div>
    <div class="drawer-panel">
      <div class="drawer-head"><strong>Meny</strong><button class="drawer-close" id="drawer-close" type="button" aria-label="Stäng meny">×</button></div>
      <nav class="drawer-nav" id="drawer-nav"></nav>
      <div class="drawer-section"><p class="drawer-label">Utseende</p><div class="theme-row"><button class="secondary" data-theme-choice="dark">Mörkt</button><button class="secondary" data-theme-choice="light">Ljust</button></div></div>
      <div class="drawer-section"><p class="drawer-label">Information & stöd</p><a class="drawer-btn" href="/faq.html">FAQ</a><button class="drawer-btn" type="button" data-feedback-open>Kontakt & feedback</button><a class="drawer-btn" href="mailto:politiker@denied.se?subject=Politikerkontakt">Maila admin</a><a class="drawer-btn" href="https://klarsprak.denied.se" target="_blank" rel="noopener">Klarspråk</a></div>
      <div class="drawer-section"><button class="drawer-btn" id="logout-btn" type="button">Logga ut</button></div>
    </div>
  </aside>
  <div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="modal-backdrop" id="modal-backdrop"></div>
    <div class="modal-card">
      <div class="credential-head"><h2 id="modal-title"></h2><button class="ghost" id="modal-close" type="button" aria-label="Stäng">Stäng</button></div>
      <div id="modal-body"></div>
    </div>
  </div>
  <script type="module" src="/v2.js"></script>
</body>
</html>
