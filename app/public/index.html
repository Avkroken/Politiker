<body>
  <a class="skip-link" href="#root">Hoppa till innehållet</a>
  <div id="service-band" class="service-band" hidden>

      <span>Svensk demokratitjänst</span>

    </div>
  </div>

  <header id="app-header" class="site-header" hidden>
    <div class="site-header__inner">
      <a class="brand" href="#home" aria-label="PolitikerKontakt – startsida">
        <img class="brand__logo" src="/brand-logo.svg" alt="PolitikerKontakt">
      </a>
      <nav id="primary-nav" class="primary-nav" aria-label="Huvudnavigering"></nav>
      <div class="header-actions">
        <button id="session-button" class="button button--secondary session-button" type="button" hidden>Logga in</button>
        <button id="menu-button" class="button button--quiet menu-button" type="button" aria-label="Öppna meny" aria-expanded="false">Meny</button>
      </div>
    </div>
  </header>

  <div id="global-notices" class="notice-host" aria-live="polite"></div>
  <main id="root" tabindex="-1"></main>

  <footer id="app-footer" class="site-footer" hidden>
    <div class="site-footer__inner">
      <a class="site-footer__brand" href="#home" aria-label="PolitikerKontakt – startsida">
        <img src="/brand-logo.svg" alt="PolitikerKontakt">

      <nav aria-label="Sidfotslänkar">

        <a href="/faq.html#integritet">Integritet</a>
        <button id="footer-feedback" type="button">Kontakt</button>
      </nav>
    </div>
  </footer>

  <div id="mobile-menu" class="overlay" hidden>
    <button class="overlay__scrim" type="button" data-close-menu aria-label="Stäng meny"></button>
    <aside class="sheet" aria-label="Meny">

      <nav id="mobile-nav" class="mobile-nav"></nav>
    </aside>

  <div id="modal" class="overlay overlay--center" hidden>
    <button class="overlay__scrim" type="button" data-close-modal aria-label="Stäng dialog"></button>
    <section class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">

      <div id="modal-body"></div>
    </section>

  <script src="/app.js" defer></script>
