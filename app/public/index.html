<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#11131c">
  <meta name="color-scheme" content="dark">
  <title>Politikerkontakt</title>
  <meta name="description" content="Kontakta folkvalda från ditt eget e-postkonto.">
  <link rel="stylesheet" href="/nocturne.css">
  <link rel="stylesheet" href="/politiker.css">
</head>
<body>
  <header id="app-header" class="site-header" hidden>
    <div class="site-header__inner">
      <a class="brand" href="#home" aria-label="Politikerkontakt – startsida">
        <span class="brand__mark" aria-hidden="true">P</span>
        <span>Politikerkontakt</span>
      </a>
      <nav id="primary-nav" class="primary-nav" aria-label="Huvudnavigering"></nav>
      <button id="menu-button" class="button button--quiet menu-button" type="button" aria-label="Öppna meny" aria-expanded="false">Meny</button>
    </div>
  </header>

  <div id="global-notices" class="notice-host" aria-live="polite"></div>
  <main id="root"></main>

  <div id="mobile-menu" class="overlay" hidden>
    <button class="overlay__scrim" type="button" data-close-menu aria-label="Stäng meny"></button>
    <aside class="sheet" aria-label="Meny">
      <div class="sheet__head"><strong>Meny</strong><button class="button button--quiet" type="button" data-close-menu>Stäng</button></div>
      <nav id="mobile-nav" class="mobile-nav"></nav>
    </aside>
  </div>

  <div id="modal" class="overlay overlay--center" hidden>
    <button class="overlay__scrim" type="button" data-close-modal aria-label="Stäng dialog"></button>
    <section class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <div class="modal__head"><h2 id="modal-title"></h2><button class="button button--quiet" type="button" data-close-modal>Stäng</button></div>
      <div id="modal-body"></div>
    </section>
  </div>

  <script src="/app.js" defer></script>
  <script src="/letter-import.js" defer></script>
  <script src="/app-send.js" defer></script>
  <script src="/recipient-meta.js" defer></script>
  <script src="/app-settings.js" defer></script>
  <script src="/app-admin.js" defer></script>
</body>
</html>
