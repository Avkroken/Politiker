# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json

inheritance: true

reviews:
  request_changes_workflow: false
  path_instructions:
    - path: "app/src/**"
      instructions: |
        Treat D1 as canonical application state and preserve the distinct roles of KV,
        R2, Queue/DLQ, Durable Objects, and Cloudflare Email.
        Auth and credential-sensitive mutations must fail closed.
        CredentialRateLimiter is the serialized coordination point for mail/provider
        rate limiting; do not replace it with process-local, KV, or racy D1 state.
        Preserve query-string redaction and never expose SMTP/OAuth/API/encryption secrets.
    - path: "app/src/send*.ts"
      instructions: |
        Review sending paths for idempotency, persistent recipient/job state,
        retry classification, bounce handling, queue acknowledgement semantics,
        credential-scoped rate limits, and safe behavior across Worker retries.
    - path: "app/src/*auth*.ts"
      instructions: |
        Review authentication changes for session freshness, CSRF/same-origin boundaries,
        account scoping, token secrecy, revocation, and fail-closed authorization.
    - path: "shared/**"
      instructions: |
        Treat shared SMTP/provider/crypto/input-safety utilities as security-sensitive
        cross-cutting contracts. Flag changes that broaden network targets, leak secrets,
        weaken validation, or change retry/failure classification unexpectedly.
    - path: "infra/migrations/**"
      instructions: |
        Review migrations as forward-only versioned schema changes.
        Preserve existing production data and keep runtime code compatible with the
        migration order used by Wrangler/D1.
  finishing_touches:
    docstrings:
      enabled: true
    unit_tests:
      enabled: true
    simplify:
      enabled: true
    autofix:
      enabled: true
    fix_ci:
      enabled: true
    resolve_merge_conflict:
      enabled: true
  pre_merge_checks:
    override_requested_reviewers_only: true
    docstrings:
      mode: error
      threshold: 100

code_generation:
  docstrings:
    path_instructions:
      - path: "app/src/**/*.ts"
        instructions: |
          Use TSDoc for exported and non-trivial functions/classes.
          Include @param and @returns when applicable and @throws for meaningful failures.
          Document D1/KV/R2/Queue/Durable Object/Email side effects, auth requirements,
          rate-limit semantics, account scoping, idempotency, retries, and secret boundaries.
      - path: "shared/**/*.ts"
        instructions: |
          Use TSDoc for reusable APIs.
          Document validation assumptions, cryptographic or credential boundaries,
          provider/network side effects, retry/failure semantics, and caller-visible errors.
      - path: "app/public/**/*.js"
        instructions: |
          Use concise JSDoc for reusable or non-trivial client functions.
          Document API calls, DOM mutation, user-visible state changes, and security-sensitive
          flows; do not add comments that only restate minified or obvious implementation.
      - path: "app/tests/**/*.test.ts"
        instructions: |
          Keep test documentation concise.
          State the auth, storage, queue, rate-limit, provider, migration, privacy,
          or UI contract protected by the test.
      - path: "scripts/**/*.{js,mjs}"
        instructions: |
          Use JSDoc for reusable functions.
          Document deployment/verification side effects, expected environment inputs,
          failure behavior, and production-versus-preview boundaries.
  unit_tests:
    path_instructions:
      - path: "app/src/**/*.ts"
        instructions: |
          Follow the existing node:test and fake-binding patterns.
          Prioritize account isolation, fresh-session and same-origin checks, D1 canonical
          state, Durable Object rate limits, queue retry/ack behavior, SMTP/provider
          failures, idempotency, revocation races, and secret non-exposure.
      - path: "shared/**/*.ts"
        instructions: |
          Follow existing node:test conventions.
          Cover malformed inputs, boundary values, external/provider failures,
          credential redaction, protocol parsing, and deterministic retry classification.
      - path: "app/public/**/*.js"
        instructions: |
          Prefer repository-style source/DOM contract tests over brittle snapshots.
          Cover API route usage, disabled/loading/error states, credential-safe rendering,
          and accessibility-relevant behavior.
