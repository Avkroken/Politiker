# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json

# CodeRabbit är rådgivande. Kör inte automatiska review-rundor eller
# blockerande commit-statusar som förbrukar begränsad review-kvot.
inheritance: true

reviews:
  review_progress: false
  commit_status: false
  fail_commit_status: false
  auto_review:
    enabled: false
    auto_incremental_review: false
    auto_pause_after_reviewed_commits: 0
    drafts: false