# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json

# Behåll organisationens CodeRabbit-inställningar men gör merge-signalen explicit
# och fail-closed för just detta repository.
inheritance: true

reviews:
  # CodeRabbit sätter commit-statusen `CodeRabbit` till pending medan reviewn
  # pågår och success först när reviewn är färdig.
  commit_status: true
  # Reviewfel, quota-/integrationsproblem eller annan oförmåga att granska får
  # inte kunna se ut som en färdig review.
  fail_commit_status: true
  auto_review:
    enabled: true
    # Varje ny push ska granskas; en tidigare HEAD får inte återanvändas.
    auto_incremental_review: true
    drafts: false
