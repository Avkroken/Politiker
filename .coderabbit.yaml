# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json

# Behåll organisationens CodeRabbit-inställningar men gör review-signalen explicit
# och fail-closed för just detta repository.
inheritance: true

reviews:
  # Använd CodeRabbits kanoniska GitHub progress/check-run-yta. Legacy
  # commit_status är inte tillräckligt fail-closed eftersom rate limiting kan
  # rapporteras som en lyckad legacy-status.
  review_progress: true
  # Reviewfel, quota-/integrationsproblem eller annan oförmåga att granska får
  # inte kunna se ut som en färdig review.
  fail_commit_status: true
  auto_review:
    enabled: true
    # Varje ny push ska granskas; en tidigare HEAD får inte återanvändas.
    auto_incremental_review: true
    # Inaktivera standardpausen efter fem granskade commits.
    auto_pause_after_reviewed_commits: 0
    drafts: false
