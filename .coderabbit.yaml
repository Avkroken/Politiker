# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json

# Behåll organisationens CodeRabbit-inställningar men gör den dokumenterade
# commit-statusen fail-closed för just detta repository.
inheritance: true

reviews:
  # CodeRabbit sätter statusen till pending under review och success när reviewn
  # är klar. Live-rulesetet ska kräva contexten `CodeRabbit`.
  commit_status: true
  # Om CodeRabbit inte kan slutföra reviewen ska samma status bli failure i
  # stället för ett falskt success.
  fail_commit_status: true
  auto_review:
    enabled: true
    # Varje ny push ska granskas; en tidigare HEAD får inte återanvändas.
    auto_incremental_review: true
    # Inaktivera standardpausen efter fem granskade commits.
    auto_pause_after_reviewed_commits: 0
    drafts: false
